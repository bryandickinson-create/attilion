<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Attillion</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap">
<style>
/* Layout: one centred column; altitude bands carry the
   rarity story. Single outer-space theme by choice, so both host themes look the same. */
:root {
  color-scheme: dark;
  --sea: #070a1f;          /* page ground */
  --sea-2: #10163a;        /* raised surface */
  --sea-3: #232c5e;        /* borders, inputs */
  --foam: #eef0ff;         /* main text */
  --kelp: #a6abd8;         /* secondary text */
  --krill: #ff8a4c;        /* accent: rocket-flame orange */
  --krill-ink: #2a1206;
  --sunlight: #8fd8ff;
  --twilight: #7aa2ff;
  --midnight: #a58bff;
  --abyss: #dcdcf0;
  --hadal: #ffc93c;          /* 1 in Attillion: gold */
  --bad: #c86a6a;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-data: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 14px;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--sea); color: var(--foam);
  background-image: linear-gradient(180deg, #03040f 0%, var(--sea) 340px, #0e1a4a 100%);
  background-attachment: fixed;
  font: 16px/1.55 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
#app { max-width: 880px; margin: 0 auto; container-type: inline-size; container-name: app; transition: max-width .35s ease; }
/* Screen mode from Settings: Auto follows the real screen; the others pin the layout. */
html[data-device="phone"] #app { max-width: 400px; }
html[data-device="ipad"] #app { max-width: 780px; }
html[data-device="computer"] #app { max-width: 880px; min-width: min(880px, 100%); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--krill); outline-offset: 3px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 18px; flex-wrap: wrap; }
.brand { background: none; border: 0; font: 800 24px/1 var(--font-display); letter-spacing: -0.02em; display: flex; align-items: center; gap: 10px; padding: 0; }
.mark { position: relative; width: 24px; height: 24px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ffc49a, var(--krill) 55%, #b9431a); }
.mark::after { content: ""; position: absolute; left: -7px; right: -7px; top: 9px; height: 6px; border: 2px solid #ffd9b8; border-radius: 50%; transform: rotate(-18deg); border-bottom-color: transparent; }
.top nav { display: flex; gap: 8px; align-items: center; }
.top nav button { background: none; border: 1px solid transparent; padding: 8px 12px; border-radius: 999px; color: var(--kelp); }
.top nav button:hover { color: var(--foam); }
.top nav .chip { border-color: var(--sea-3); color: var(--foam); }
.chip b { font-family: var(--font-data); color: var(--krill); font-weight: 600; }

/* type */
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; letter-spacing: -0.02em; margin: 0; }
h1 { font-size: clamp(34px, 6cqi, 58px); line-height: 1.02; font-weight: 800; }
h1 em { font-style: normal; color: var(--krill); }
h2 { font-size: 22px; font-weight: 700; }
.eyebrow { text-transform: uppercase; letter-spacing: .12em; font-size: 12px; color: var(--kelp); margin: 0 0 10px; font-family: var(--font-data); }
.lede { max-width: 62ch; color: var(--kelp); font-size: 18px; margin: 16px 0 0; }
.lede strong { color: var(--foam); }
.lede.small { font-size: 16px; }
.hint, .note { color: var(--kelp); font-size: 14px; }
.note { border-left: 2px solid var(--sea-3); padding-left: 12px; margin-top: 28px; }
.link { background: none; border: 0; padding: 0; color: var(--krill); text-decoration: underline; text-underline-offset: 3px; }

/* buttons */
.btn { border-radius: 999px; padding: 12px 22px; font-weight: 700; border: 1px solid transparent; transition: transform .12s ease, background .12s; }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--krill); color: var(--krill-ink); }
.btn.primary:hover { background: #ffab7a; }
.btn.ghost { background: transparent; border-color: var(--sea-3); }
.btn.ghost:hover { border-color: var(--kelp); }
.row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }

/* home */
.hero { padding-block: 28px 8px; }
.legend { list-style: none; padding: 0; margin: 28px 0 0; display: grid; grid-template-columns: repeat(5, 1fr); border-radius: var(--r); overflow: hidden; font-size: 13px; }
.legend li { padding: 12px 12px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.legend .zn { font-weight: 700; }
.legend .zd { font-family: var(--font-data); opacity: .8; font-size: 12px; }
.legend .z-sunlight { background: #24508a; color: var(--sunlight); }
.legend .z-twilight { background: #1b2f6a; color: var(--twilight); }
.legend .z-midnight { background: #151d4f; color: #a58bff; }
.legend .z-abyss { background: #10143a; color: #dcdcf0; }
.legend .z-hadal { background: #07081a; color: var(--hadal); box-shadow: inset 0 0 0 1px rgba(255,201,60,.35); }

.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 32px; }
.mode { background: var(--sea-2); border: 1px solid var(--sea-3); border-radius: var(--r); padding: 22px; display: flex; flex-direction: column; min-width: 0; }
.mode p { color: var(--kelp); margin: 10px 0 0; }
.mode .btn { align-self: flex-start; margin-top: 16px; }
.mode .row .btn { margin-top: 0; }
.mode-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.tag { font-family: var(--font-data); font-size: 12px; color: var(--kelp); }
.mode.daily { background: linear-gradient(160deg, #1d2a66, var(--sea-2) 70%); }
.done b { color: var(--krill); font-family: var(--font-data); }
.mode.bots { grid-column: 1 / -1; }
.bots-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 14px; }
.bot { text-align: left; background: var(--sea); border: 1px solid var(--sea-3); border-radius: 12px; padding: 14px; display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; min-width: 0; transition: border-color .15s, transform .15s; }
.bot:hover { border-color: var(--kelp); transform: translateY(-2px); }
.bot-name { font: 700 18px var(--font-display); }
.bot-elo { font-family: var(--font-data); font-size: 13px; color: var(--kelp); align-self: center; }
.bot-blurb { grid-column: 1 / -1; color: var(--kelp); font-size: 13px; line-height: 1.4; }
.bot-minnow .bot-name { color: var(--sunlight); }
.bot-fish .bot-name { color: var(--twilight); }
.bot-barracuda .bot-name { color: #a58bff; }
.bot-shark .bot-name { color: var(--krill); }

/* play */
.play-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding-block: 6px 18px; }
.scoreline { display: flex; gap: 18px; font-size: 15px; color: var(--kelp); }
.scoreline b { color: var(--foam); font-family: var(--font-data); font-size: 18px; margin-left: 4px; }
.pips { display: flex; gap: 6px; }
.pip { width: 26px; height: 6px; border-radius: 3px; background: var(--sea-3); }
.pip.done { background: var(--kelp); }
.pip.now { background: var(--krill); }
.prompt-card, .reveal { background: var(--sea-2); border: 1px solid var(--sea-3); border-radius: 20px; padding: clamp(22px, 5cqi, 44px); text-align: center; position: relative; }
.round-label { font-family: var(--font-data); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--kelp); margin: 0 0 8px; }
.prompt { font-size: clamp(30px, 6cqi, 50px); line-height: 1.05; font-weight: 800; margin: 0 auto 26px; max-width: 18ch; }
.prompt.small { font-size: clamp(24px, 4cqi, 34px); margin-bottom: 20px; }
.ring { --p: 1; width: 74px; height: 74px; margin: 0 auto 18px; border-radius: 50%; display: grid; place-items: center;
  background: conic-gradient(var(--krill) calc(var(--p) * 360deg), var(--sea-3) 0); }
.ring span { width: 60px; height: 60px; border-radius: 50%; background: var(--sea-2); display: grid; place-items: center; font: 600 24px var(--font-data); }
#answer-form { display: flex; gap: 10px; max-width: 560px; margin: 0 auto; }
#answer { flex: 1; min-width: 0; font: 500 20px var(--font-body); padding: 14px 18px; border-radius: 999px; border: 1px solid var(--sea-3); background: var(--sea); color: var(--foam); }
#answer:focus { border-color: var(--krill); outline: none; }
.waiting { font-size: 18px; color: var(--kelp); }
.waiting b { color: var(--foam); }
.opp-status { color: var(--kelp); font-size: 14px; margin: 18px 0 0; display: flex; justify-content: center; align-items: center; gap: 8px; }
.opp-status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--kelp); animation: pulse 1.2s infinite; }
.opp-status.on .dot { background: var(--krill); animation: none; }
.opp-status.on::after { content: "· locked in"; color: var(--krill); }
@keyframes pulse { 50% { opacity: .3; } }

.answers { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; text-align: left; }
.ans { border-radius: 14px; padding: 18px; background: var(--sea); border: 1px solid var(--sea-3); min-width: 0; }
.ans .who { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--kelp); font-family: var(--font-data); }
.ans .said { margin: 6px 0 0; font: 700 26px/1.15 var(--font-display); overflow-wrap: anywhere; }
.ans .matched { margin: 2px 0 0; font-size: 13px; color: var(--kelp); }
.ans .pts { margin: 10px 0 0; font-size: 15px; color: var(--kelp); }
.ans .pts b { font: 700 34px var(--font-data); color: var(--zc, var(--foam)); margin-right: 4px; }
.ans .meta { margin: 2px 0 0; font-size: 13px; color: var(--kelp); }
.gauge { margin-top: 14px; height: 10px; border-radius: 5px; background: linear-gradient(90deg, #24508a, #1b2f6a 10%, #151d4f 30%, #10143a 55%, #07081a); position: relative; }
.gauge span { position: absolute; left: var(--d); top: 50%; width: 16px; height: 16px; border-radius: 50%; background: var(--zc, var(--foam)); transform: translate(-50%, -50%); box-shadow: 0 0 0 3px var(--sea); animation: sink .9s cubic-bezier(.2,.8,.2,1); }
@keyframes sink { from { left: 0; } }
.ans.z-sunlight { --zc: var(--sunlight); }
.ans.z-twilight { --zc: var(--twilight); }
.ans.z-midnight { --zc: #a58bff; }
.ans.z-abyss { --zc: #dcdcf0; }
.ans.z-hadal { --zc: var(--hadal); border-color: rgba(255,201,60,.55); background: radial-gradient(circle at 80% 0%, rgba(255,201,60,.14), transparent 60%), var(--sea); }
.ans.invalid .said { color: var(--kelp); text-decoration: line-through; text-decoration-color: var(--bad); }
.same { color: var(--krill); margin: 14px 0 0; }
.trench { color: var(--kelp); font-size: 14px; margin: 18px 0 20px; }

/* results */
.results, .narrow { padding-top: 16px; }
.narrow { max-width: 620px; }
.totals { display: flex; gap: 26px; align-items: flex-end; margin: 22px 0 8px; flex-wrap: wrap; }
.totals div { display: flex; flex-direction: column; }
.totals span { color: var(--kelp); font-size: 13px; }
.totals b { font: 700 46px/1 var(--font-data); }
.totals .of { color: var(--kelp); font-size: 14px; padding-bottom: 6px; }
.elo-change { font-family: var(--font-data); color: var(--kelp); }
.elo-change b { color: var(--krill); }
.table-wrap { overflow-x: auto; margin: 20px 0; }
table { width: 100%; border-collapse: collapse; font-size: 15px; }
th { text-align: left; font-weight: 600; color: var(--kelp); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; padding: 8px 10px; border-bottom: 1px solid var(--sea-3); }
td { padding: 10px; border-bottom: 1px solid rgba(35,44,94,.6); vertical-align: top; }
td.n { font-family: var(--font-data); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
td.q { color: var(--kelp); }
td.sub { color: var(--kelp); font-size: 13px; }
td.up { color: var(--twilight); } td.down { color: var(--bad); }
tr.you td { color: var(--krill); }
tr.botrow td { color: var(--kelp); font-style: italic; }
.empty { color: var(--kelp); text-align: center; padding: 26px; }
.share { margin: 20px 0; display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
.share pre { margin: 0; background: var(--sea-2); border: 1px solid var(--sea-3); padding: 14px 18px; border-radius: 12px; font: 15px/1.6 var(--font-data); white-space: pre-wrap; }
.codebox { background: var(--sea-2); border: 1px solid var(--sea-3); border-radius: var(--r); padding: 20px; margin: 20px 0; display: grid; gap: 8px; }
.codebox label { font-size: 12px; color: var(--kelp); text-transform: uppercase; letter-spacing: .08em; margin-top: 6px; }
.codebox .btn { justify-self: start; }
textarea, .stack input { width: 100%; background: var(--sea); color: var(--foam); border: 1px solid var(--sea-3); border-radius: 10px; padding: 12px; font: 14px var(--font-data); resize: vertical; }
.stack { display: grid; gap: 8px; margin-top: 22px; }
.stack label { font-size: 13px; color: var(--kelp); }
.stack input { font: 16px var(--font-body); }
.stack .btn { justify-self: start; margin-top: 6px; }
.error { color: var(--krill); min-height: 1.2em; margin: 0; font-size: 14px; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 22px 0 28px; }
.stats div { background: var(--sea-2); border: 1px solid var(--sea-3); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; }
.stats span { color: var(--kelp); font-size: 12px; }
.stats b { font: 700 24px var(--font-data); }
.narrow h2 { margin-top: 28px; }
.dives { list-style: none; padding: 0; }
.dives li { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--sea-3); }
.dives b { font-family: var(--font-data); }
.tabs { display: flex; gap: 6px; margin-top: 20px; }
.tabs button { background: none; border: 1px solid var(--sea-3); border-radius: 999px; padding: 8px 16px; color: var(--kelp); }
.tabs button[aria-selected="true"] { background: var(--foam); color: var(--sea); border-color: var(--foam); }

@container app (max-width: 720px) {
  .modes { grid-template-columns: 1fr; }
  .bots-grid { grid-template-columns: 1fr 1fr; }
  .legend { grid-template-columns: 1fr; }
  .legend li { flex-direction: row; justify-content: space-between; padding: 8px 12px; }
  .stats { grid-template-columns: 1fr 1fr; }
  #answer-form { flex-direction: column; }
  .top nav button:first-child { padding-inline: 6px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ===== living background + effects ===== */
#sea-bg, #fx-layer { position: fixed; inset: 0; pointer-events: none; }
#sea-bg { z-index: 0; }
#fx-layer { z-index: 60; }
#app { position: relative; z-index: 1; }
body::after { /* darkens the water as the game goes deeper */
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background: radial-gradient(ellipse at 50% 120%, rgba(0,0,0,.55), transparent 60%);
}
.mode, .prompt-card, .reveal { backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
.mode { background-color: rgba(16,22,58,.82); }
.prompt-card, .reveal { background-color: rgba(16,22,58,.85); }

/* scoreboard */
.scoreboard { display: grid; grid-template-columns: 1fr auto 1fr; align-items: stretch; gap: 12px; margin: 4px 0 18px; }
.scoreboard.solo { grid-template-columns: 1fr auto; }
.pod { background: rgba(7,10,31,.8); border: 1px solid var(--sea-3); border-radius: 14px; padding: 10px 14px 12px; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 10px; min-width: 0; }
.pod.opp { text-align: right; }
.pod.opp .pod-name { order: 2; }
.pod.opp .pod-total { order: 1; justify-self: start; }
.pod-name { font-weight: 700; font-family: var(--font-display); font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pod.me .pod-name { color: var(--krill); }
.pod-total { font: 700 30px/1 var(--font-data); font-variant-numeric: tabular-nums; }
.pod-rounds { grid-column: 1 / -1; order: 3; display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; height: 26px; align-items: end; }
.pod-note { grid-column: 1 / -1; order: 4; font-size: 12px; color: var(--kelp); }
.seg { display: block; height: 100%; border-radius: 3px; background: var(--sea-3); position: relative; overflow: hidden; }
.seg::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: var(--h); background: var(--zc, var(--kelp)); border-radius: 3px; }
.seg.z-sunlight { --zc: var(--sunlight); } .seg.z-twilight { --zc: var(--twilight); } .seg.z-midnight { --zc: #a58bff; }
.seg.z-abyss { --zc: #dcdcf0; } .seg.z-hadal { --zc: var(--hadal); box-shadow: 0 0 10px rgba(255,201,60,.6); } .seg.miss { --zc: var(--bad); --h: 8% !important; }
.seg.fresh::after { animation: segrise .9s cubic-bezier(.2,.8,.2,1); }
.pod.opp .seg.fresh::after { animation-delay: 1.1s; animation-fill-mode: backwards; }
@keyframes segrise { from { height: 0; } }
.sb-mid { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 4px; text-align: center; min-width: 96px; }
.sb-round { font-family: var(--font-data); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--kelp); }
.sb-lead { font-weight: 700; font-size: 14px; }

/* opponent card waits a beat before revealing */
.ans { transition: filter .4s, opacity .4s, transform .4s; }
.ans.pending { filter: blur(10px) saturate(.3); opacity: .5; transform: scale(.97); }

/* per-zone card reactions */
.ans.fx-sunlight { animation: shimmer 1s ease-out; }
.ans.fx-twilight { animation: sway 1.2s ease-out; }
.ans.fx-midnight { animation: glowblue 1.6s ease-out; }
.ans.fx-abyss { animation: glowpurple 2s ease-out; }
.ans.fx-hadal { animation: krillcard 2.4s ease-out; }
@keyframes shimmer { 0% { box-shadow: 0 0 0 0 rgba(143,216,255,.6); } 100% { box-shadow: 0 0 0 18px rgba(143,216,255,0); } }
@keyframes sway { 0%,100% { transform: none; } 25% { transform: translateX(-5px) rotate(-.5deg); } 60% { transform: translateX(4px) rotate(.4deg); } }
@keyframes glowblue { 0% { box-shadow: 0 0 0 rgba(165,139,255,0); } 30% { box-shadow: 0 0 40px rgba(165,139,255,.55); } 100% { box-shadow: 0 0 0 rgba(165,139,255,0); } }
@keyframes glowpurple { 0% { box-shadow: 0 0 0 rgba(220,220,240,0); transform: none; } 30% { box-shadow: 0 0 60px rgba(220,220,240,.6); transform: scale(1.02); } 100% { box-shadow: 0 0 0 rgba(220,220,240,0); transform: none; } }
@keyframes krillcard { 0% { transform: scale(.9); } 20% { transform: scale(1.06); box-shadow: 0 0 80px rgba(255,201,60,.8); } 100% { transform: none; box-shadow: 0 0 24px rgba(255,201,60,.25); } }
.ans.z-hadal .pts b { text-shadow: 0 0 18px rgba(255,201,60,.8); }

/* 1 in Attillion takeover */
body.krillion-hit::after { background: radial-gradient(ellipse at center, rgba(40,30,4,.35), rgba(0,0,0,.75)); transition: background .3s; }
.krillion-banner { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; cursor: pointer; pointer-events: auto; background: radial-gradient(ellipse at center, rgba(24,18,4,.82), rgba(3,4,14,.9) 70%); animation: dim .3s both;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.kb-inner { text-align: center; animation: slam .7s cubic-bezier(.2,1.6,.4,1) both; }
.kb-who { font-family: var(--font-data); text-transform: uppercase; letter-spacing: .2em; font-size: 14px; color: #ffe9a8; margin: 0; }
.kb-big { margin: 4px 0 0; font: 800 clamp(48px, 13vw, 140px)/.9 var(--font-display); letter-spacing: -.04em; color: var(--hadal);
  text-shadow: 0 0 30px rgba(255,201,60,.7), 0 0 90px rgba(255,201,60,.45), 0 6px 0 #7a5a10; }
.kb-big span { display: block; font-size: .38em; color: var(--foam); letter-spacing: 0; text-shadow: 0 0 20px rgba(255,255,255,.35); }
.kb-pts { font: 700 34px var(--font-data); color: var(--foam); margin: 10px 0 0; animation: rise 1s .35s both; }
.krillion-banner.out { animation: fadeout .45s forwards; }
@keyframes slam { 0% { transform: scale(2.6); opacity: 0; filter: blur(8px); } 60% { opacity: 1; filter: none; } 100% { transform: scale(1); } }
@keyframes rise { from { transform: translateY(20px); opacity: 0; } }
@keyframes fadeout { to { opacity: 0; transform: scale(.96); } }
#app.shake { animation: shake .5s; }
@keyframes shake { 10%,90% { transform: translate(-2px, 1px); } 20%,80% { transform: translate(4px,-2px); } 30%,50%,70% { transform: translate(-6px, 3px); } 40%,60% { transform: translate(6px,-3px); } }

@container app (max-width: 720px) {
  .scoreboard { gap: 8px; }
  .pod { padding: 8px 10px 10px; }
  .pod-name { font-size: 14px; }
  .pod-total { font-size: 24px; }
  .sb-mid { min-width: 64px; }
  .sb-lead { font-size: 12px; }
}
@keyframes dim { from { opacity: 0; } }
.answer-error { color: var(--krill); min-height: 1.4em; margin: 10px 0 0; font-size: 15px; }
#answer.nope { border-color: var(--krill); animation: nope .4s; }
@keyframes nope { 20%,60% { transform: translateX(-8px); } 40%,80% { transform: translateX(8px); } }

/* ===== twists, avatars, water column ===== */
.prompt .twist { display: block; color: var(--krill); font-size: .62em; margin-top: 8px; letter-spacing: -0.01em; }
.prompt.small .twist { font-size: .7em; margin-top: 4px; }
.top nav .avbtn { font-size: 22px; line-height: 1; padding: 6px 10px; border-color: var(--sea-3); }

.reveal-grid { display: grid; grid-template-columns: 210px 1fr; gap: 16px; align-items: stretch; text-align: left; }
.reveal-grid .answers { align-content: start; }
.dive { position: relative; border-radius: 14px; overflow: hidden; min-height: 300px; display: grid; grid-template-rows: repeat(5, 1fr); border: 1px solid var(--sea-3); }
.band { position: relative; display: flex; align-items: flex-start; padding: 6px 8px; }
.band span { font: 600 10px var(--font-data); letter-spacing: .08em; text-transform: uppercase; opacity: .75; }
.band.z-sunlight { background: linear-gradient(180deg, #3a74b0, #24508a); color: var(--sunlight); }
.band.z-twilight { background: #1b2f6a; color: var(--twilight); }
.band.z-midnight { background: #151d4f; color: #a58bff; }
.band.z-abyss { background: #10143a; color: #dcdcf0; }
.band.z-hadal { background: linear-gradient(180deg, #0a0a1e, #151005); color: var(--hadal); box-shadow: inset 0 0 30px rgba(255,201,60,.15); }
.diver { position: absolute; top: 93%; display: flex; flex-direction: column; align-items: center; transform: translate(-50%, -10%); transition: top 1.6s cubic-bezier(.3,.7,.2,1); z-index: 2; }
.dive.duo .diver.me { left: 36%; } .dive.duo .diver.opp { left: 72%; }
.dive.solo .diver.me { left: 58%; }
.diver.go { top: var(--y); }
.diver .av { font-size: 30px; line-height: 1; filter: drop-shadow(0 2px 6px rgba(0,0,0,.5)); animation: bob 2.4s ease-in-out infinite; }

.diver .tag { margin-top: 2px; font: 600 11px var(--font-body); background: rgba(5,8,26,.75); padding: 1px 7px; border-radius: 999px; white-space: nowrap; max-width: 90px; overflow: hidden; text-overflow: ellipsis; }
.diver.me .tag { color: var(--krill); }
.diver.pending { opacity: .35; }
.diver.miss .av { filter: grayscale(1) opacity(.6); }
.diver::before { content: ""; position: absolute; top: 34px; left: 50%; width: 3px; height: 0; transform: translateX(-50%); border-radius: 2px; background: linear-gradient(rgba(255,190,140,.75), rgba(255,138,76,0)); transition: height 1.6s; }
.diver.go::before { height: 70px; }
.diver.miss::before { display: none; }
@keyframes bob { 50% { translate: 0 -4px; } }
.played { margin: 4px 0 0; font-size: 13px; color: var(--kelp); }
.played b { font-family: var(--font-data); color: var(--foam); }
.totals em { font-style: normal; font-size: 13px; color: var(--kelp); margin-top: 4px; font-family: var(--font-data); }

.avatars { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; margin-top: 22px; }
.avatar { background: var(--sea-2); border: 1px solid var(--sea-3); border-radius: 14px; padding: 14px 8px 12px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.avatar .ae { font-size: 38px; line-height: 1.1; }
.avatar .an { font-weight: 700; font-size: 14px; }
.avatar .al { font-size: 12px; color: var(--kelp); font-family: var(--font-data); }
.avatar:not([disabled]):hover { border-color: var(--kelp); }
.avatar.on { border-color: var(--krill); box-shadow: 0 0 0 1px var(--krill) inset; }
.avatar.on .al { color: var(--krill); }
.avatar[disabled] { cursor: not-allowed; opacity: .55; }
.avatar[disabled] .ae { filter: grayscale(1) brightness(.6); }

@container app (max-width: 720px) {
  .reveal-grid { grid-template-columns: 1fr; }
  .dive { min-height: 230px; }
}

/* ===== profile krillions + settings ===== */
.stats { grid-template-columns: repeat(6, 1fr); }
.stats .gold b { color: var(--hadal); text-shadow: 0 0 14px rgba(255,201,60,.45); }
.krill-wall { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; margin-top: 14px; align-items: start; }
.krill-card { border-radius: 14px; padding: 14px; border: 1px solid rgba(255,201,60,.45); background: radial-gradient(circle at 85% 0%, rgba(255,201,60,.16), transparent 60%), #0a0d24; min-width: 0; }
.krill-card p { margin: 0; }
.kc-a { font: 700 20px/1.15 var(--font-display); color: var(--hadal); overflow-wrap: anywhere; }
.kc-q { font-size: 13px; color: var(--foam); margin-top: 6px !important; }
.kc-m { font: 11px var(--font-data); color: var(--kelp); margin-top: 6px !important; }
.setting-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 14px; }
.setting-row label { font-weight: 600; }
.setting-row input[type=range] { flex: 1; min-width: 140px; accent-color: var(--krill); }
.setting-row output { font-family: var(--font-data); width: 4ch; text-align: right; }
.btn.small { padding: 8px 16px; font-size: 14px; }
#rename-form, #pw-form { border-top: 1px solid var(--sea-3); padding-top: 18px; }
@container app (max-width: 720px) { .stats { grid-template-columns: repeat(3, 1fr); } }
.code-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 18px; }
.code-row label { font-weight: 600; }
.code-row input { flex: 1; min-width: 160px; background: var(--sea); color: var(--foam); border: 1px solid var(--sea-3); border-radius: 999px; padding: 10px 16px; font: 15px var(--font-data); letter-spacing: .08em; text-transform: uppercase; }
#code-msg { margin-top: 8px; }
.devtag, .secrettag { font-style: normal; font: 700 9px var(--font-data); letter-spacing: .08em; padding: 1px 5px; border-radius: 4px; vertical-align: middle; }
.devtag { background: #7c4dff; color: #fff; }
.secrettag { background: var(--sea-3); color: var(--kelp); text-transform: uppercase; }
/* golden Developer creature in the Attillion zone */
.dive .diver.golden { cursor: pointer; z-index: 3; }
.diver.golden .av { filter: sepia(1) saturate(5) hue-rotate(-12deg) brightness(1.15) drop-shadow(0 0 10px rgba(255,201,60,.9)); }
.diver.golden .av.spin { animation: devspin 1.1s cubic-bezier(.2,.8,.2,1); }
.diver.golden .tag { color: var(--hadal); box-shadow: 0 0 0 1px rgba(255,201,60,.5); }
@keyframes devspin { 0% { transform: rotate(0) scale(1); } 50% { transform: rotate(400deg) scale(1.5); } 100% { transform: rotate(720deg) scale(1); } }
/* Attillion trophy creatures */
.avg { display: inline-block; }
.av-gdragon { filter: sepia(1) saturate(5) hue-rotate(-12deg) brightness(1.15) drop-shadow(0 0 6px rgba(255,201,60,.85)); }
.av-rdragon { animation: rainbow 2.4s linear infinite; }
@keyframes rainbow {
  0%   { filter: hue-rotate(0deg) saturate(2) drop-shadow(0 0 6px #ff4d6d); }
  25%  { filter: hue-rotate(90deg) saturate(2) drop-shadow(0 0 6px #ffd23f); }
  50%  { filter: hue-rotate(180deg) saturate(2) drop-shadow(0 0 6px #3ee08f); }
  75%  { filter: hue-rotate(270deg) saturate(2) drop-shadow(0 0 6px #4d9dff); }
  100% { filter: hue-rotate(360deg) saturate(2) drop-shadow(0 0 6px #ff4d6d); }
}
.avatar[disabled] .ae .avg { animation: none; filter: none; }
.unlock-note { margin: 14px auto 0; max-width: 520px; padding: 10px 14px; border-radius: 12px; border: 1px solid rgba(255,201,60,.5); background: rgba(255,201,60,.08); color: var(--foam); }
.unlock-note .avg { font-size: 22px; vertical-align: middle; }
/* Rainbow Developer */
.av-rdev { animation: rainbow 2.4s linear infinite; }
.diver.golden .av:has(.av-rdev) { filter: drop-shadow(0 0 10px rgba(255,255,255,.7)); }
.av-gdev { filter: sepia(1) saturate(5) hue-rotate(-12deg) brightness(1.15) drop-shadow(0 0 6px rgba(255,201,60,.85)); }
.diver.golden .av:has(.av-gdev) { filter: drop-shadow(0 0 12px rgba(255,201,60,.9)); }
.dev-takeover.gold { background: radial-gradient(circle at var(--ox) var(--oy), rgba(255,201,60,.14), rgba(3,4,14,.55) 70%); }
.dev-takeover.gold .dev-giant { animation: devgrow 2.9s cubic-bezier(.5,0,.3,1) forwards; }
.dev-takeover.gold .dev-label { color: #ffc93c; text-shadow: 0 0 22px rgba(255,201,60,.7), 0 4px 0 rgba(0,0,0,.4); }
.dev-takeover { position: fixed; inset: 0; z-index: 55; overflow: hidden; pointer-events: auto; cursor: pointer;
  background: radial-gradient(circle at var(--ox) var(--oy), rgba(255,255,255,.08), rgba(3,4,14,.55) 70%); animation: devfade 2.9s ease-in forwards; }
.dev-giant { position: absolute; left: var(--ox); top: var(--oy); font-size: 100px; line-height: 1; transform: translate(-50%, -50%) scale(.08);
  animation: devgrow 2.9s cubic-bezier(.5,0,.3,1) forwards, rainbow 1.2s linear infinite; }
.dev-label { position: absolute; left: 50%; bottom: 12%; transform: translateX(-50%); margin: 0; white-space: nowrap;
  font: 800 clamp(28px, 7vw, 64px) var(--font-display); color: #fff; text-shadow: 0 0 20px rgba(255,255,255,.6), 0 4px 0 rgba(0,0,0,.4);
  animation: devlabel 2.9s ease forwards; }
@keyframes devgrow {
  0%   { left: var(--ox); top: var(--oy); transform: translate(-50%, -50%) scale(.08) rotate(0); }
  55%  { left: 50%; top: 50%; transform: translate(-50%, -50%) scale(4) rotate(-8deg); }
  85%  { left: 50%; top: 50%; transform: translate(-50%, -50%) scale(16) rotate(6deg); opacity: 1; }
  100% { left: 50%; top: 50%; transform: translate(-50%, -50%) scale(22); opacity: 0; }
}
@keyframes devlabel { 0%, 30% { opacity: 0; transform: translateX(-50%) scale(.6); } 45%, 80% { opacity: 1; transform: translateX(-50%) scale(1); } 100% { opacity: 0; } }
@keyframes devfade { 0%, 85% { opacity: 1; } 100% { opacity: 0; } }

.btn:disabled { opacity: .6; cursor: default; }

/* show / hide password */
.pw-wrap { position: relative; display: block; }
.pw-wrap input { width: 100%; padding-right: 48px; }
.pw-eye { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); background: none; border: 0; font-size: 18px; line-height: 1; padding: 6px 8px; border-radius: 8px; opacity: .8; }
.pw-eye:hover, .pw-eye[aria-pressed="true"] { opacity: 1; background: rgba(255,255,255,.06); }
.forgot { margin-top: 18px; } .forgot summary { cursor: pointer; color: var(--krill); } .forgot[open] summary { margin-bottom: 6px; }

/* Subject Launches */
.mode.subjects { grid-column: 1 / -1; background: linear-gradient(160deg, #123a4e, var(--sea-2) 70%); }
.subject-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin-top: 14px; }
.subject { background: var(--sea); border: 1px solid var(--sea-3); border-radius: 12px; padding: 14px 8px; display: grid; justify-items: center; gap: 4px; min-width: 0; transition: border-color .15s, transform .15s; }

.subj-name { font-weight: 700; }
.subj-best { font-size: .8rem; opacity: .75; }

function leadText(oppName) {

function total(list) { return (list || []).reduce((s, x) => s + (x ? x.points : 0), 0); }

    res.code = b64e({ v: 1, id: c.id, reply: true, p: S.prompts, av: myAvatarObj().id, from: u ? u.name : "Your friend", elo: u ? u.elo - (res.elo ? res.elo.delta : 0) : null, a: S.mine, host: c.a, hostName: c.from });
  }

  S.view = "results";
  render();

/* ---------- quick match ----------
 * Uses the shared page's live room (window.claude "room" capability): everyone who
 * has Attillion open right now. Searchers put a card in their presence; every page
 * runs the same pairing (closest Elo, window widening the longer you wait) and two
 * players are matched once each names the other. The match then runs in its own
 * named room, where each player's presence carries their answers round by round.
 * Presence is visible to the room, so a determined player could peek at answers
 * early; the game never shows them before the round ends. */
let roomP = null, Q = null;
function getRoom() {
  if (!roomP) {
    const c = window.claude;
    roomP = c && typeof c.use === "function" ? Promise.resolve(c.use("room")).catch(() => null) : Promise.resolve(null);
  }
  return roomP;
}
function myCard() { const u = me(); return { name: u ? u.name : "Guest pilot", elo: u ? u.elo : START_ELO, av: myAvatarObj().id }; }
function cleanCard(p, field) {   // everything in presence is untrusted
  const q = p && p.presence && p.presence[field];
  if (!q || typeof q !== "object") return null;
  const elo = Math.max(100, Math.min(3500, Math.round(+q.elo) || START_ELO));
  const name = String(q.name || "").replace(/[^\p{L}\p{N} _.-]/gu, "").trim().slice(0, 20) || "Pilot";
  return { peer: p.peer, name, elo, av: avatarById(String(q.av)) ? String(q.av) : "rocket", t: +q.t || 0, want: typeof q.want === "string" ? q.want : null };
}
function eloWindow(waitMs) { return Math.min(800, 150 + Math.floor(Math.max(0, waitMs) / 5000) * 75); }
function pairUp(list, now) {
  list.sort((a, b) => a.t - b.t || (a.peer < b.peer ? -1 : 1));
  const used = new Set(), pairs = new Map();
  for (const a of list) {
    if (used.has(a.peer)) continue;
    let best = null;
    for (const b of list) {
      if (b === a || used.has(b.peer)) continue;
      const d = Math.abs(a.elo - b.elo);
      if (d <= Math.max(eloWindow(now - a.t), eloWindow(now - b.t)) && (!best || d < Math.abs(a.elo - best.elo))) best = b;
    }
    if (best) { used.add(a.peer); used.add(best.peer); pairs.set(a.peer, best); pairs.set(best.peer, a); }
  }
  return pairs;
}
let lobbyPeers = 0;
function onlineText() { return lobbyPeers > 1 ? `${lobbyPeers} players online` : lobbyPeers === 1 ? "Just you online" : ""; }
getRoom().then(room => {
  if (!room) return;
  room.onPeers(ch => {
    lobbyPeers = ch.peers.filter(p => p.kind === "viewer").length;
    const el = document.getElementById("online"); if (el) el.textContent = onlineText();
    if (Q) queueUpdate();
  }, () => {});
});

function queueStart() {
  const me_ = { since: Date.now(), want: null, matched: false, peer: null };
  Q = me_;
  getRoom().then(room => {
    if (Q !== me_) return;
    if (!room) { me_.none = true; queueText(); return; }
    me_.room = room;
    room.presence({ q: Object.assign(myCard(), { t: me_.since, want: null }) }).catch(() => {});
    me_.timer = setInterval(queueUpdate, 1000);
    queueUpdate();
  });
}
function queueStop() {
  if (!Q) return;
  clearInterval(Q.timer);
  if (Q.room && !Q.matched) Q.room.presence({ q: null }).catch(() => {});
  Q = null;
}
function queueUpdate() {
  if (!Q || !Q.room || Q.matched) return;
  const peers = Q.room.peers();
  const mine = peers.find(p => p.sameTab);
  if (!mine) { queueText(); return; }
  Q.peer = mine.peer;
  // other tabs of your own are not opponents
  const list = peers.filter(p => p.kind === "viewer" && !p.sameTab && !p.isMe).map(p => cleanCard(p, "q")).filter(Boolean);
  list.push(Object.assign({ peer: Q.peer, t: Q.since, want: Q.want }, myCard()));
  Q.searching = list.length;
  const partner = pairUp(list, Date.now()).get(Q.peer) || null;
  const want = partner ? partner.peer : null;
  if (want !== Q.want) { Q.want = want; Q.room.presence({ q: Object.assign(myCard(), { t: Q.since, want }) }).catch(() => {}); }
  if (partner && partner.want === Q.peer) { liveJoin(partner); return; }
  queueText();
}
function queueText() {
  const t = document.getElementById("q-text"), h = document.getElementById("q-title"), x = document.getElementById("q-extra");
  if (!t || !Q) return;
  if (Q.none) {
    h.textContent = "Quick match needs the shared Attillion page";
    t.textContent = "Live matches run through the Attillion page on Claude, where everyone it's shared with can play. This copy can't reach other players, but the computer and friend challenges still work.";
    if (x) x.hidden = false;
    return;
  }
  const waited = Date.now() - Q.since;
  if (Q.matched) { h.textContent = "Match found!"; t.textContent = "Diving in…"; return; }
  const others = Math.max(0, (Q.searching || 1) - 1);
  t.textContent = `${lobbyPeers || 1} online · ${others} other${others === 1 ? "" : "s"} searching · looking within ±${eloWindow(waited)} Elo · ${Math.floor(waited / 1000)}s`;
  if (x) x.hidden = waited < 30000;
}
function viewQueue() {
  const c = myCard();
  const near = Object.entries(BOTS).reduce((a, b) => Math.abs(b[1].elo - c.elo) < Math.abs(a[1].elo - c.elo) ? b : a);
  setTimeout(() => { if (!Q) queueStart(); queueText(); }, 0);
  return `${header()}<main class="queue">
    <div class="queue-card">
      <div class="sonar" aria-hidden="true"><i></i><i></i><i></i><span class="sonar-av">${myAvatar()}</span></div>
      <h1 id="q-title">Finding a player near ${c.elo}</h1>

        <button class="btn ghost" data-act="quick-cancel">Cancel</button>
      </div>

        <button class="btn primary" data-act="bot" data-level="${near[0]}">Play ${near[1].name} (${near[1].elo})</button>
      </div>
    </div>
  </main>`;
}

async function liveJoin(opp) {
  const q = Q; q.matched = true; clearInterval(q.timer); queueText();
  const lobby = q.room;
  const [a, b] = [q.peer, opp.peer].sort();
  const ta = a === q.peer ? q.since : opp.t, tb = a === q.peer ? opp.t : q.since;
  const seed = hashStr("quick:" + a + "|" + b + "|" + ta + "|" + tb);
  const name = "km-" + seed.toString(36) + "-" + hashStr(b + a + tb).toString(36);
  // keep our lobby card (naming them) up until they arrive, so they see the match too
  let mr = null;
  try { mr = await lobby.join(name); } catch (e) { mr = null; }
  if (Q !== q) { if (mr) mr.leave().catch(() => {}); return; }
  if (!mr) { lobby.presence({ q: null }).catch(() => {}); Q = null; go("queue"); return; }
  const L = { room: mr, name, seed, opp, oppPeer: opp.peer, ans: Array(ROUNDS).fill(null), at: 0, gone: false, goneAt: null, done: false };
  mr.presence({ hi: myCard(), at: 0, ans: L.ans }).catch(() => {});
  // wait for them to arrive in the match room
  const arrived = await new Promise(res => {
    const until = Date.now() + 15000;
    const check = () => {
      if (mr.peers().some(p => p.peer === opp.peer)) return res(true);
      if (Date.now() > until || Q !== q) return res(false);
      setTimeout(check, 250);
    };
    check();
  });
  lobby.presence({ q: null }).catch(() => {});
  if (!arrived || Q !== q) { mr.leave().catch(() => {}); if (Q === q) { Q = null; go("queue"); } return; }
  Q = null;   // the search is over
  L.unsub = mr.onPeers(() => liveCheck(), () => { L.gone = true; liveCheck(); });
  L.poll = setInterval(liveCheck, 500);
  SFX("lock");
  startMatch({ mode: "live", seed, prompts: pickPrompts(seed), live: L });
}
function livePresence() {
  const L = S.live; if (!L || L.stopped) return;
  L.room.presence({ hi: myCard(), at: L.at, ans: L.ans, done: L.done || null }).catch(() => {});
}
function liveOpp() { const L = S.live; return L && !L.stopped ? L.room.peers().find(p => p.peer === L.oppPeer) || null : null; }
function liveOppAnswerRaw(r) { const o = liveOpp(); const a = o && Array.isArray(o.presence.ans) ? o.presence.ans[r] : null; return typeof a === "string" ? a.slice(0, 60) : null; }
function liveOppAnswered(r) { return liveOppAnswerRaw(r) != null; }
function liveOppAnswer(r) { const a = liveOppAnswerRaw(r); return a == null ? "" : a; }
function liveCheck() {
  const L = S.live;
  if (!L || L.stopped || S.view !== "play") return;
  const o = liveOpp();
  if (!o) { if (!L.goneAt) L.goneAt = Date.now(); if (!L.gone && Date.now() - L.goneAt > 8000) { L.gone = true; liveGoneNote(); } }
  else L.goneAt = null;
  const at = o && Number.isFinite(+o.presence.at) ? +o.presence.at : -1;
  if (S.phase === "waiting" && (liveOppAnswered(S.round) || L.gone || Date.now() > S.deadline + 8000)) reveal();
  else if (S.phase === "next-wait" && (at > S.round || L.gone)) { S.round++; beginRound(); }
}
function liveGoneNote() {
  const ol = document.getElementById("opplock");
  if (ol) { ol.classList.remove("on"); ol.textContent = `${S.live.opp.name} left the match. Finish your rounds and the win is yours.`; }
  const w = document.querySelector(".waiting");

}
function liveStop(L) {
  if (!L || L.stopped) return;
  L.stopped = true;

  L.room.leave().catch(() => {});
}

    body = `
      <div class="prompt-card">
        <div class="ring" id="ring" style="--p:1"><span id="clock">${ROUND_SECONDS}</span></div>
        <p class="round-label">Round ${S.round + 1} of ${ROUNDS}</p>
        <h2 class="prompt">${promptTitle(prompt)}</h2>
        ${S.phase === "answer" ? `
        <form id="answer-form" autocomplete="off">
          <label for="answer" class="sr">Your answer</label>
          <input id="answer" maxlength="60" placeholder="Type the rarest answer you can" autocapitalize="off" spellcheck="false">
          <button class="btn primary" type="submit">Lock in</button>
        </form>
        <p class="answer-error" id="answer-error" role="alert"></p>` : `<p class="waiting">Locked in: <b>${esc(S.mine[S.round] || "(blank)")}</b>. Waiting for ${esc(oppName)}…</p>`}
        ${oppName ? `<p class="opp-status" id="opplock">${S.live && S.live.gone ? `${esc(oppName)} left the match. Finish your rounds and the win is yours.` : S.mode === "challenge-guest" ? `${esc(oppName)} already answered. You'll see it at the end of the round.` : `<span class="dot"></span>${esc(oppName)} is thinking`}</p>` : ""}
      </div>`;
  } else {
    body = revealBlock(prompt, oppName);
  }
  return `${header()}<main class="play">
    ${scoreLine}
    ${body}
  </main>`;
}

function promptTitle(p) { return p.twist ? `${esc(p.baseQ)} <span class="twist">${esc(p.twist)}</span>` : esc(p.q); }
// Where an answer's avatar ends up in the sky column (percent from the top).
// Rarer answers climb higher; a miss stays on the launch pad at the bottom.
function diveY(r) {
  if (!r || !r.valid) return 93;
  // each zone is a 20% band, the rarest at the top; stay below the band's label
  const bounds = [0, 200, 1000, 4000, 6000, MAX_DEPTH];
  for (let z = 0; z < 5; z++) {
    if (r.depth <= bounds[z + 1] || z === 4) {
      const f = Math.min(1, (r.depth - bounds[z]) / (bounds[z + 1] - bounds[z]));
      return (4 - z) * 20 + 16 - f * 9;
    }
  }
  return 8;
}
function diveColumn(oppName) {
  const zones = ZONES.slice().reverse().map(z => `<div class="band z-${z.key}"><span>${z.name}</span></div>`).join("");
  // The Developer creature turns gold in the Attillion zone, and spins when tapped.
  const diver = (cls, av, label, r) => { const gold = isDevAvatar(av) && r && r.points === 100; return `<div class="diver ${cls} ${r && r.valid ? "" : "miss"} ${gold ? "golden" : ""}" style="--y:${diveY(r).toFixed(1)}%" ${gold ? `data-act="spin" title="Tap me"` : ""}><span class="av">${av}</span><span class="tag">${esc(label)}${isDevAvatar(av) ? ` <i class="devtag">DEV</i>` : ""}</span></div>`; };
  return `<div class="dive ${S.lastTheirs ? "duo" : "solo"}" aria-hidden="true">${zones}
    ${diver("me", myAvatar(), "You", S.lastMine)}
    ${S.lastTheirs ? diver("opp pending", oppAvatar(), oppName, S.lastTheirs) : ""}
  </div>`;
}
function leadTextAt(oppName, a, b) { return a === b ? "Tied" : a > b ? `You lead by ${a - b}` : `${esc(oppName)} leads by ${b - a}`; }
function answerCard(label, r, me_) {
  if (!r) return "";
  const depthPct = r.valid ? Math.min(100, (r.depth / MAX_DEPTH) * 100) : 0;
  return `<div class="ans ${me_ ? "mine" : "theirs pending"} ${r.valid ? "z-" + r.zone.key : "invalid"}">
    <p class="who">${esc(label)}</p>
    <p class="said">${r.valid ? esc(r.display) : r.raw ? esc(r.raw) : "<i>no answer</i>"}</p>
    ${r.valid ? `
      ${norm(r.raw) !== norm(r.display) ? `<p class="matched">you typed “${esc(r.raw)}”</p>` : ""}
      <div class="gauge" aria-hidden="true"><span style="--d:${depthPct.toFixed(1)}%"></span></div>
      <p class="pts"><b>0</b> pts</p>
      <p class="meta">${r.zone.name} · ${altText(r.depth)} up · ${oneIn(r.share)}</p>${r.used ? `<p class="hint repeat-note">You've said this ${r.used === 1 ? "once" : r.used + " times"} before, so it counts as more common now.</p>` : ""}
      <p class="played">Played like <b>${perfElo(r.points, 1).toLocaleString()}</b></p>
      ${r.points === 100 ? `<p class="what" data-what="${esc(r.display)}" data-hint="${esc(curHint())}" hidden></p>` : ""}`
    : `<p class="pts"><b>0</b> pts</p><p class="meta">${r.raw ? "Not on our list for this prompt" : "Time ran out"}</p><p class="played">Played like <b>${perfElo(0, 1).toLocaleString()}</b></p>`}
  </div>`;
}

function revealBlock(prompt, oppName) {
  const deep = prompt.answers.slice(prompt.krillFrom, prompt.familiar).map((a, i) => ({ a, i }));
  const r = rng(hashStr(prompt.id + S.seed));
  const samples = []; const pool = deep.slice();
  while (samples.length < 4 && pool.length) samples.push(pool.splice(Math.floor(r() * pool.length), 1)[0].a.display);
  const same = S.lastTheirs && S.lastMine.valid && S.lastTheirs.valid && S.lastMine.idx === S.lastTheirs.idx;
  return `<div class="reveal">
    <p class="round-label">Round ${S.round + 1} of ${ROUNDS}</p>
    <h2 class="prompt small">${promptTitle(prompt)}</h2>
    <div class="reveal-grid">
    ${diveColumn(oppName)}
    <div class="answers">
      ${answerCard("You", S.lastMine, true)}
      ${S.lastTheirs ? answerCard(oppName, S.lastTheirs, false) : ""}
    </div>
    </div>
    ${same ? `<p class="same">Same answer. You both score it.</p>` : ""}
    ${S.unlockNote ? `<p class="unlock-note">That's Attillion #${S.unlockNote.krill}! You unlocked the ${avMarkup(S.unlockNote)} <b>${S.unlockNote.name}</b>. <button class="link" data-go="settings">Use it</button></p>` : ""}
    <p class="trench">Up among the stars: ${samples.map(esc).join(", ")}</p>
    <button class="btn primary" id="next" data-act="next">${S.round < ROUNDS - 1 ? "Next prompt" : "See results"}</button>
  </div>`;
}

function viewResults() {
  const res = S.result;
  const oppName = curOppName();
  const verdict = !oppName ? "" : res.my > res.their ? "You win" : res.my < res.their ? `${esc(oppName)} wins` : "It's a tie";
  const rows = S.prompts.map((id, i) => {
    const m = S.scores[i], t = S.oppScores[i];
    return `<tr><td class="q">${esc(PROMPT_BY_ID[id].q)}</td><td>${esc(m.raw || "–")}</td><td class="n">${m.points}</td>${oppName ? `<td>${esc(t ? t.raw || "–" : "–")}</td><td class="n">${t ? t.points : 0}</td>` : ""}</tr>`;
  }).join("");
  let extra = "";
  if (res.elo) {
    const sign = res.elo.delta > 0 ? "+" : "";
    extra += `<p class="elo-change">Elo ${sign}${res.elo.delta} → <b>${me().elo}</b></p>`;
  } else if (oppName && !me()) {
    extra += `<p class="hint"><button class="link" data-go="login">Log in</button> to have games count toward your Elo.</p>`;
  }
  if (S.mode === "live" && res.forfeit) extra += `<p class="hint">${esc(oppName)} left before the end, so their missing rounds scored 0.</p>`;
  if (S.mode === "solo") {
    const st = soloStats();
    extra += res.newBest && res.prevBest > 0 ? `<p class="best-note">New personal best! Up from ${res.prevBest}.</p>`
      : res.newBest ? `<p class="best-note">Your first Free Launch score. Now beat it.</p>`
      : `<p class="hint">Your best Free Launch: <b>${st.best}</b> · ${st.plays} launch${st.plays === 1 ? "" : "es"} so far</p>`;
  }
  if (S.mode === "subject") {
    const st = subjectStats(S.cat);
    extra += res.newBest && res.prevBest > 0 ? `<p class="best-note">New ${subjName()} best! Up from ${res.prevBest}.</p>`
      : res.newBest ? `<p class="best-note">Your first ${subjName()} Launch score. Now beat it.</p>`
      : `<p class="hint">Your best ${subjName()} Launch: <b>${st.best}</b> · ${st.plays} launch${st.plays === 1 ? "" : "es"} so far</p>`;
  }
  if (S.mode === "daily") {
    extra += `<div class="share"><pre id="share-text">${esc(dailyShare(S.dailyKey, S.scores))}</pre><button class="btn ghost" data-act="copy" data-target="share-text">Copy result</button></div>`;
  }
  if (S.mode === "challenge-host") {
    extra += codeBox("Send this to your friend", res.code, "c",
      "They'll play the same 7 prompts and see your answer after each round. When they finish, they'll get a reply code. Paste it under Enter a code to see who won.");
  }
  if (S.mode === "challenge-guest") {
    extra += codeBox(`Send this back to ${esc(S.challenge.from)}`, res.code, "r", "Their game updates when they paste it under Enter a code.");
  }
  return `${header()}<main class="results">
    <p class="eyebrow">${S.mode === "live" ? "Quick match" : S.mode === "solo" ? "Free Launch" : S.mode === "subject" ? subjName() + " Launch" : S.mode === "daily" ? "Daily Launch #" + dailyNumber(S.dailyKey) : S.mode === "bot" ? "vs " + BOTS[S.level].name : S.mode === "challenge-host" ? "Challenge created" : "Challenge from " + esc(S.challenge.from)}</p>
    <h1>${verdict || `You scored ${res.my}`}</h1>
    <div class="totals">
      <div><span>${myAvatar()} You</span><b>${res.my}</b><em>played like ${perfElo(res.my, ROUNDS).toLocaleString()}</em></div>
      ${oppName ? `<div><span>${oppAvatar()} ${esc(oppName)}</span><b>${res.their}</b><em>played like ${perfElo(res.their, ROUNDS).toLocaleString()}</em></div>` : ""}
      <div class="of">out of ${ROUNDS * 100}</div>
    </div>
    ${extra}
    <div class="table-wrap"><table class="breakdown"><thead><tr><th>Prompt</th><th>You</th><th>Pts</th>${oppName ? `<th>${esc(oppName)}</th><th>Pts</th>` : ""}</tr></thead><tbody>${rows}</tbody></table></div>
    <div class="row">
      ${S.mode === "live" ? `<button class="btn primary" data-act="quick">Find another match</button>` : ""}
      ${S.mode === "solo" ? `<button class="btn primary" data-act="solo">Launch again</button>` : ""}
      ${S.mode === "subject" ? `<button class="btn primary" data-act="subject" data-cat="${S.cat}">Play ${subjName()} again</button>` : ""}
      ${S.mode === "bot" ? `<button class="btn primary" data-act="bot" data-level="${S.level}">Rematch ${BOTS[S.level].name}</button>` : ""}
      <button class="btn ghost" data-go="home">Back to Earth</button>
    </div>
  </main>`;
}

function codeBox(title, code, kind, note) {
  const link = canLink() ? linkFor(kind, code) : null;
  return `<div class="codebox">
    <h3>${title}</h3>
    ${link ? `<label for="share-link">Link</label><textarea id="share-link" readonly rows="2">${esc(link)}</textarea><button class="btn primary" data-act="copy" data-target="share-link">Copy link</button>` : ""}
    <label for="share-code">Code</label><textarea id="share-code" readonly rows="3">${esc(code)}</textarea>
    <button class="btn ${link ? "ghost" : "primary"}" data-act="copy" data-target="share-code">Copy code</button>
    <p class="hint">${note}</p>
  </div>`;
}

function dailyShare(key, scores) {
  const blocks = scores.map(s => !s.valid ? "⬛" : s.points === 100 ? "🌟" : s.depth >= 4000 ? "🟪" : s.depth >= 1000 ? "🟦" : s.depth >= 200 ? "🟩" : "⬜").join("");
  const krill = scores.filter(s => s.points === 100).length;
  return `Attillion Daily Launch #${dailyNumber(key)}\n${blocks}\n${total(scores)}/700${krill ? ` · ${krill}× 1 in Attillion` : ""}`;
}

/* ---------- "What is it?" blurbs for 1 in Attillion answers ----------
 * Looked up live from Wikipedia (search for the answer plus the prompt's topic),
 * cached in this browser. If the lookup is blocked or finds nothing, the blurb
 * just doesn't show. */
function topicHint(q) {
  let t = String(q || "").replace(/^Name\s+/i, "").replace(/^(a|an|some)\s+/i, "");
  if (/^something\b/i.test(t)) { const w = t.split(/\s+/); return w[w.length - 1]; }
  t = t.replace(/^(type of|kind of|famous|piece of|way to|item of)\s+/i, "").replace(/^part of the human body/i, "anatomy").replace(/^game kids play.*/i, "game");
  t = t.split(/\s+(?:in|on|at|that|that's|with|or|you|people|for|ending|starting)\b|,/i)[0];
  return t.replace(/^(type of|kind of|famous)\s+/i, "").trim();
}
function curHint() { const pr = S.prompts && PROMPT_BY_ID[S.prompts[S.round]]; return pr ? topicHint(pr.baseQ || pr.q) : ""; }
const descMem = {};
function lookupDesc(answer, hint) {
  const key = (answer + "|" + hint).toLowerCase();
  if (key in descMem) return Promise.resolve(descMem[key]);
  const cache = store.get("desc", {});
  if (key in cache) { descMem[key] = cache[key]; return Promise.resolve(cache[key]); }
  const ctl = typeof AbortController === "function" ? new AbortController() : null;
  const to = setTimeout(() => ctl && ctl.abort(), 7000);
  const url = "https://en.wikipedia.org/w/api.php?" + new URLSearchParams({
    action: "query", format: "json", origin: "*", redirects: "1",
    generator: "search", gsrsearch: (answer + " " + hint).trim(), gsrlimit: "1",
    prop: "extracts|description|info", inprop: "url", exintro: "1", explaintext: "1", exsentences: "2"
  });
  const p = fetch(url, ctl ? { signal: ctl.signal } : {}).then(r => r.ok ? r.json() : Promise.reject(0)).then(j => {
    const pages = j && j.query && j.query.pages; if (!pages) return null;
    const pg = Object.values(pages)[0] || {};
    let text = String(pg.extract || "").replace(/\s*\([^()]*\)/g, "").replace(/\s+/g, " ").trim();
    const m = text.match(/^.{20,}?[.!?](?=\s|$)/); if (m) text = m[0];
    if (text.length > 200) text = text.slice(0, 197).replace(/\s+\S*$/, "") + "…";
    if (!text && pg.description) text = pg.description.charAt(0).toUpperCase() + pg.description.slice(1) + ".";
    if (!text || /may (also )?refer to/i.test(text)) return null;
    return { t: text, url: pg.fullurl || "https://en.wikipedia.org/wiki/" + encodeURIComponent(String(pg.title || answer).replace(/ /g, "_")) };
  }).then(v => {
    descMem[key] = v;
    const c = store.get("desc", {}); c[key] = v; const ks = Object.keys(c); if (ks.length > 400) delete c[ks[0]]; store.set("desc", c);
    return v;
  }, () => null).finally(() => clearTimeout(to));

}
function fillDescriptions() {

    el.dataset.done = "1"; el.hidden = false; el.classList.add("loading"); el.textContent = "Looking it up…";

      el.append(b, d.t + " ", a);

  });
}

function openCode(raw) {

document.addEventListener("submit", async e => {

    } else {

    }

    go("home");
  }
  else if (e.target.id === "code-form") {

      celebrateAvatar(bundle.pick);
      return;
    }
    const a = AVATARS.find(x => x.code === h);
    if (!a) { SFX("error"); go("settings", { codeMsg: "That code doesn't unlock anything." }); return; }
    const u = me();
    if (redeemed(u).includes(a.id)) { go("settings", { codeMsg: `You already have the ${a.name}.` }); return; }
    if (u) updateUser(x => { x.codes = (x.codes || []).concat(a.id); x.avatar = a.id; });
    else { store.set("guestCodes", redeemed(null).concat(a.id)); store.set("guestAvatar", a.id); }
    go("settings", { codeMsg: `Unlocked: ${a.e} ${a.name}${a.dev ? " (Developer)" : ""}. It's now your avatar.` });

      SFX("lock"); go("settings", { renameMsg: "Username changed to " + name + "." });
    } else {

      all[oldKey].hash = await hashPw(u.name, newPw); saveUsers(all);

    }
  }
  else if (e.target.id === "forgot-form") {
    const u = me(); if (!u) return;
    const a = document.getElementById("forgot-pw").value, b2 = document.getElementById("forgot-pw2").value;

if (!fromHash()) render();

  ctx.fillStyle = "#8ea3d8"; ctx.fillRect(-3, -3, 6, 6);
  ctx.fillStyle = "#3d5fbf"; ctx.fillRect(-15, -2, 10, 4); ctx.fillRect(5, -2, 10, 4);
  ctx.restore();
}

let last = performance.now(), t = 0;
function frameBg(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; t += dt;
  depthTint += (depthTarget - depthTint) * Math.min(1, dt * 1.5);
  bx.clearRect(0, 0, W, H);

  // the glow of the atmosphere at the bottom fades as the game climbs higher
  const hz = bx.createLinearGradient(0, H, 0, H * 0.45);
  hz.addColorStop(0, `rgba(70,130,255,${0.22 * (1 - depthTint * 0.85)})`); hz.addColorStop(1, "rgba(70,130,255,0)");
  bx.fillStyle = hz; bx.fillRect(0, H * 0.45, W, H * 0.55);

  // soft nebula clouds
  bx.save(); bx.globalCompositeOperation = "lighter";
  nebulae.forEach(n => {
    n.p += dt * 0.08;
    const x = (n.x + Math.sin(n.p) * 0.02) * W, y = (n.y + Math.cos(n.p * 0.8) * 0.02) * H, r = n.r * Math.max(W, H);
    const g = bx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(${n.c},${0.07 + depthTint * 0.04})`); g.addColorStop(1, `rgba(${n.c},0)`);
    bx.fillStyle = g; bx.beginPath(); bx.arc(x, y, r, 0, TAU); bx.fill();
  });
  bx.restore();

  // a ringed planet low on the right
  const px = W * 0.86, py = H * (0.8 - depthTint * 0.12), pr = Math.min(W, H) * 0.09;
  const pg = bx.createRadialGradient(px - pr * 0.4, py - pr * 0.4, pr * 0.1, px, py, pr);
  pg.addColorStop(0, "rgba(255,190,150,.55)"); pg.addColorStop(1, "rgba(120,60,140,.35)");
  bx.fillStyle = pg; bx.beginPath(); bx.arc(px, py, pr, 0, TAU); bx.fill();
  bx.strokeStyle = "rgba(255,215,180,.35)"; bx.lineWidth = 3;
  bx.beginPath(); bx.ellipse(px, py, pr * 1.8, pr * 0.42, -0.35, 0, TAU); bx.stroke();

  // twinkling stars, brighter as you climb
  stars.forEach(st => {
    st.tw += dt * st.ts;
    st.y += dt * (0.002 + st.l * 0.004); if (st.y > 1.01) { st.y = -0.01; st.x = Math.random(); }
    const a = (0.35 + 0.65 * (0.5 + 0.5 * Math.sin(st.tw))) * (0.55 + depthTint * 0.45);
    bx.fillStyle = st.hue ? `hsla(${st.hue},80%,80%,${a})` : `rgba(255,255,255,${a})`;
    bx.beginPath(); bx.arc(st.x * W, st.y * H, st.r, 0, TAU); bx.fill();
    if (st.l === 2 && a > 0.75) sparkle(bx, st.x * W, st.y * H, st.r * 3.2, "#ffffff", (a - 0.75) * 1.6);
  });

  // shooting stars now and then
  if (shooting.length < 2 && Math.random() < dt * 0.25) {
    const dir = Math.random() < 0.5 ? 1 : -1, ang = dir > 0 ? rand(0.3, 0.6) : Math.PI - rand(0.3, 0.6);
    shooting.push({ x: dir > 0 ? rand(-0.1, 0.5) * W : rand(0.5, 1.1) * W, y: rand(-0.05, 0.4) * H, ang, sp: rand(500, 900), life: rand(0.6, 1.1) });
  }
  for (let i = shooting.length - 1; i >= 0; i--) {
    const m = shooting[i]; m.life -= dt; m.x += Math.cos(m.ang) * m.sp * dt; m.y += Math.sin(m.ang) * m.sp * dt;
    drawMeteor(bx, m.x, m.y, 110, m.ang, Math.max(0, m.life) * 0.9, "200,220,255");
    if (m.life <= 0) shooting.splice(i, 1);
  }

  // a satellite drifting across
  if (crafts.length < 1 && Math.random() < dt * 0.05) {
    const dir = Math.random() < 0.5 ? 1 : -1;
    crafts.push({ x: dir > 0 ? -30 : W + 30, y: rand(0.1, 0.6) * H, dir, sp: rand(18, 35), a: rand(0, TAU), blink: 0 });
  }
  for (let i = crafts.length - 1; i >= 0; i--) {
    const c = crafts[i]; c.x += c.dir * c.sp * dt; c.y -= c.sp * 0.15 * dt; c.a += dt * 0.3; c.blink += dt;
    drawSatellite(bx, c.x, c.y, c.a, 0.6);
    if (Math.sin(c.blink * 4) > 0.9) { bx.fillStyle = "rgba(255,80,80,.9)"; bx.beginPath(); bx.arc(c.x, c.y, 1.6, 0, TAU); bx.fill(); }
    if (c.x < -40 || c.x > W + 40) crafts.splice(i, 1);
  }

  if (!reduce && !document.hidden) requestAnimationFrame(frameBg);
}
requestAnimationFrame(frameBg);
document.addEventListener("visibilitychange", () => { if (!document.hidden && !reduce) { last = performance.now(); requestAnimationFrame(frameBg); } });

/* ================= reveal effects ================= */
const parts = [];
let fxRunning = false;
function runFx() {
  if (fxRunning) return; fxRunning = true; let prev = performance.now();
  (function loop(now) {
    const dt = Math.min(0.05, (now - prev) / 1000); prev = now;
    fxx.clearRect(0, 0, W, H);
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i]; p.life -= dt;
      if (p.life <= 0) { parts.splice(i, 1); continue; }
      p.update(p, dt); p.draw(fxx, p);
    }
    if (parts.length) requestAnimationFrame(loop); else { fxx.clearRect(0, 0, W, H); fxRunning = false; }
  })(prev);
}
function centerOf(el) {
  const r = el.getBoundingClientRect();
  return { x: r.left + r.width / 2, y: r.top + r.height / 2, r };
}
function gaugePoint(card) {
  const dot = card.querySelector(".gauge span");
  const c = centerOf(dot || card);
  return c;
}

const effects = {
  sunlight(card) {
    const { x, y } = gaugePoint(card);
    for (let i = 0; i < 16; i++) parts.push({
      x: x + rand(-40, 40), y: y + rand(-6, 6), r: rand(2, 6), vy: rand(-90, -40), w: rand(0, TAU), life: rand(1, 1.8), max: 1.8,
      update(p, dt) { p.y += p.vy * dt; p.w += dt * 6; },
      draw(c, p) { c.fillStyle = `rgba(143,216,255,${Math.min(0.7, p.life * 0.5)})`; c.beginPath(); c.arc(p.x + Math.sin(p.w) * 5, p.y, p.r, 0, TAU); c.fill(); }
    });
  },
  twilight(card) {
    const { r } = centerOf(card);
    const dir = Math.random() < 0.5 ? 1 : -1;
    for (let i = 0; i < 9; i++) {
      const y = r.top + rand(0.1, 0.9) * r.height, ang = dir > 0 ? rand(-0.35, -0.15) : Math.PI + rand(0.15, 0.35);
      parts.push({
        x: dir > 0 ? r.left - rand(40, 220) : r.right + rand(40, 220), y, ang, sp: rand(420, 700), life: 1.4, max: 1.4,
        update(p, dt) { p.x += Math.cos(p.ang) * p.sp * dt; p.y += Math.sin(p.ang) * p.sp * dt; },
        draw(c, p) { drawMeteor(c, p.x, p.y, 70, p.ang, Math.min(1, p.life), "122,162,255"); }
      });
    }
    ring(card, "122,162,255", 1, 1.2);
  },
  midnight(card) {
    const { x, y } = gaugePoint(card);
    for (let i = 0; i < 46; i++) {
      const a = rand(0, TAU), sp = rand(30, 160);
      parts.push({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rand(0.9, 1.9), tw: rand(0, TAU),
        update(p, dt) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.96; p.vy *= 0.96; p.tw += dt * 14; },
        draw(c, p) {
          const a2 = Math.min(1, p.life) * (0.5 + 0.5 * Math.sin(p.tw));
          const g = c.createRadialGradient(p.x, p.y, 0, p.x, p.y, 7); g.addColorStop(0, `rgba(165,139,255,${a2})`); g.addColorStop(1, "rgba(165,139,255,0)");
          c.fillStyle = g; c.beginPath(); c.arc(p.x, p.y, 7, 0, TAU); c.fill();
        }
      });
    }
  },
  abyss(card) {
    ring(card, "220,220,240", 3, 1.6);
    const { x, y } = gaugePoint(card);
    parts.push({ // a little moon rises from the altitude marker
      x, y, life: 2.4, ph: 0,
      update(p, dt) { p.ph += dt; p.y -= 38 * dt; },
      draw(c, p) {
        const a = Math.min(1, p.life / 1.2);
        c.save(); c.translate(p.x, p.y); c.globalAlpha = a;
        const g = c.createRadialGradient(0, 0, 0, 0, 0, 44); g.addColorStop(0, "rgba(230,230,255,.35)"); g.addColorStop(1, "rgba(230,230,255,0)");
        c.fillStyle = g; c.beginPath(); c.arc(0, 0, 44, 0, TAU); c.fill();
        c.fillStyle = "#e6e6f5"; c.beginPath(); c.arc(0, 0, 15, 0, TAU); c.fill();
        c.fillStyle = "rgba(160,160,190,.6)";
        [[-5, -4, 3.5], [5, 3, 2.6], [-1, 7, 2], [6, -6, 1.8]].forEach(([cx, cy, cr]) => { c.beginPath(); c.arc(cx, cy, cr, 0, TAU); c.fill(); });
        c.restore();
      }
    });
  },
  hadal(card, who, opts) { if (opts && opts.devTakeover) devTakeover(card, opts.devTakeover); else krillion(card, who); }
};

function ring(card, rgb, n, dur) {
  const { x, y } = gaugePoint(card);
  for (let i = 0; i < n; i++) parts.push({
    x, y, life: dur, max: dur, delay: i * 0.28,
    update(p, dt) { if (p.delay > 0) { p.delay -= dt; p.life += dt; } },
    draw(c, p) {
      if (p.delay > 0) return;
      const k = 1 - p.life / p.max;
      c.strokeStyle = `rgba(${rgb},${(1 - k) * 0.8})`; c.lineWidth = 2.5 * (1 - k) + 0.5;
      c.beginPath(); c.arc(p.x, p.y, 10 + k * 140, 0, TAU); c.stroke();
    }
  });
}

/* the big one: 1 in Attillion */
/* Rainbow Developer's own Attillion: the creature grows from tiny until it fills
   the screen, then vanishes. */
function devTakeover(card, id) {
  const gold = id === "gdev", plain = id === "dev";
  const { x, y } = gaugePoint(card);
  const el = document.createElement("div");
  el.className = "dev-takeover" + (gold ? " gold" : plain ? " plain" : "");
  el.style.setProperty("--ox", x + "px"); el.style.setProperty("--oy", y + "px");
  el.innerHTML = `<span class="dev-giant avg av-${gold ? "gdev" : plain ? "dev" : "rdev"}">👾</span><p class="dev-label">1 in Attillion</p>`;
  document.body.appendChild(el);
  const end = () => el.remove();
  const t = setTimeout(end, 2900);
  el.addEventListener("click", () => { clearTimeout(t); end(); });
  for (let i = 0; i < 3; i++) parts.push({
    x, y, life: 1.6, max: 1.6, delay: i * 0.2, hue: i * 120,
    update(p, dt) { if (p.delay > 0) { p.delay -= dt; p.life += dt; } },
    draw(c, p) { if (p.delay > 0) return; const k = 1 - p.life / p.max; c.strokeStyle = plain ? `hsla(${265 + p.hue / 20},90%,68%,${(1 - k) * 0.9})` : gold ? `hsla(${40 + p.hue / 30},100%,62%,${(1 - k) * 0.9})` : `hsla(${(p.hue + k * 360) % 360},90%,65%,${(1 - k) * 0.9})`; c.lineWidth = 5 * (1 - k) + 1; c.beginPath(); c.arc(p.x, p.y, 20 + k * Math.max(W, H) * 0.7, 0, TAU); c.stroke(); }
  });
}
const escH = v => String(v == null ? "" : v).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function krillion(card, who, opts) {
  const { x, y } = gaugePoint(card);
  document.body.classList.add("krillion-hit");
  const app = document.getElementById("app");
  if (app && !reduce) { app.classList.remove("shake"); void app.offsetWidth; app.classList.add("shake"); }
  const banner = document.createElement("div");
  banner.className = "krillion-banner";
  banner.innerHTML = `<div class="kb-inner"><p class="kb-who">${opts && opts.avatarHtml ? opts.avatarHtml + " " + escH(opts.label || "") : who === "you" ? "You found it" : escH(who) + " found it"}</p><p class="kb-big"><span>1 in</span> Attillion</p>${opts && opts.avatarHtml ? "" : `<p class="kb-pts">+100</p>`}</div>`;
  document.body.appendChild(banner);
  const end = () => { banner.classList.add("out"); document.body.classList.remove("krillion-hit"); setTimeout(() => banner.remove(), 500); };
  const timer = setTimeout(end, 2600);
  banner.addEventListener("click", () => { clearTimeout(timer); end(); });

  // a burst of gold stars shoots out from the altitude marker and swirls
  for (let i = 0; i < 200; i++) {
    const a = rand(0, TAU), sp = rand(120, 620);
    parts.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, rot: rand(0, TAU), spin: rand(-6, 6), size: rand(3, 8), life: rand(1.6, 3.2),
      update(p, dt) {
        p.vx *= 0.975; p.vy = p.vy * 0.975 - 20 * dt; // drift upward
        const sw = 70; p.vx += -p.vy / sw * dt * 60 * 0.15; p.vy += p.vx / sw * dt * 60 * 0.15; // swirl
        p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.spin * dt;
      },
      draw(c, p) { sparkle(c, p.x, p.y, p.size, Math.random() < 0.1 ? "#fff4cf" : "#ffc93c", Math.min(1, p.life), p.rot); }
    });
  }
  // shockwave rings
  for (let i = 0; i < 3; i++) parts.push({
    x, y, life: 1.4, max: 1.4, delay: i * 0.18,
    update(p, dt) { if (p.delay > 0) { p.delay -= dt; p.life += dt; } },
    draw(c, p) { if (p.delay > 0) return; const k = 1 - p.life / p.max; c.strokeStyle = `rgba(255,201,60,${(1 - k) * 0.9})`; c.lineWidth = 4 * (1 - k) + 1; c.beginPath(); c.arc(p.x, p.y, 20 + k * Math.max(W, H) * 0.6, 0, TAU); c.stroke(); }
  });
}

function countUp(el, to, ms) {
  if (!el) return;
  if (reduce) { el.textContent = to; return; }
  const from = +el.dataset.from || 0, start = performance.now();
  (function step(now) {
    const k = Math.min(1, (now - start) / ms), e = 1 - Math.pow(1 - k, 3);
    el.textContent = Math.round(from + (to - from) * e);
    if (k < 1) requestAnimationFrame(step);
  })(start);
}

window.KrillionFX = {
  clear() { parts.length = 0; },
  setDepth(v) { depthTarget = Math.max(0, Math.min(1, v)); },
  countUp,
  // the full 1 in Attillion moment, played when you pick a new avatar
  celebrate(el, avatarId, avatarHtml, label) {
    if (!el || reduce) return;
    if (avatarId === "dev" || avatarId === "rdev" || avatarId === "gdev") devTakeover(el, avatarId);
    else krillion(el, "", { avatarHtml, label });
    runFx();
  },
  reveal(card, zoneKey, who, opts) {
    if (!card) return;
    card.classList.add("fx-" + (zoneKey || "none"));
    if (reduce || !zoneKey || !effects[zoneKey]) return;
    effects[zoneKey](card, who, opts);
    runFx();
  }
};
})();
</script>
<script>
/* Attillion sound effects, made with the Web Audio API (no audio files).
 * window.KrillionSound.play(name, gain) and .volume (0 to 1, saved per device).
 */
(function () {
"use strict";
let ctx = null, master = null;
let vol = 0.5;
try { const v = localStorage.getItem("krillion:volume"); if (v != null) vol = Math.max(0, Math.min(1, +JSON.parse(v))); } catch (e) {}

function ensure() {
  if (!ctx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = vol * vol; master.connect(ctx.destination);
  }
  if (ctx.state === "suspended") ctx.resume();
  return ctx;
}
// browsers only allow sound after the first tap or key press
["pointerdown", "keydown"].forEach(ev => window.addEventListener(ev, ensure, { once: false, passive: true }));

function tone(freq, start, dur, type, gain, glideTo) {
  const t0 = ctx.currentTime + start;
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type || "sine";
  o.frequency.setValueAtTime(freq, t0);
  if (glideTo) o.frequency.exponentialRampToValueAtTime(glideTo, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(gain, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(out); o.start(t0); o.stop(t0 + dur + 0.05);
}
function noise(start, dur, gain, from, to) {
  const t0 = ctx.currentTime + start;
  const len = Math.floor(ctx.sampleRate * dur);
  const buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const src = ctx.createBufferSource(); src.buffer = buf;
  const f = ctx.createBiquadFilter(); f.type = "lowpass";
  f.frequency.setValueAtTime(from, t0); f.frequency.exponentialRampToValueAtTime(to, t0 + dur);
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(gain, t0 + dur * 0.3); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(f); f.connect(g); g.connect(out); src.start(t0); src.stop(t0 + dur);
}
const N = n => 440 * Math.pow(2, (n - 69) / 12); // MIDI note to Hz
let out = null;

const SOUNDS = {
  pop()      { tone(520, 0, 0.09, "sine", 0.35, 900); },
  lock()     { tone(N(72), 0, 0.08, "triangle", 0.3); tone(N(79), 0.06, 0.14, "triangle", 0.3); },
  error()    { tone(140, 0, 0.12, "square", 0.12); tone(120, 0.14, 0.16, "square", 0.12); },
  tick()     { tone(1200, 0, 0.04, "triangle", 0.15); },
  miss()     { tone(N(55), 0, 0.3, "sine", 0.25, N(48)); },
  sunlight() { for (let i = 0; i < 4; i++) tone(500 + i * 120, i * 0.07, 0.09, "sine", 0.22, 900 + i * 150); },
  twilight() { tone(N(72), 0, 0.25, "triangle", 0.25); tone(N(76), 0.12, 0.3, "triangle", 0.25); noise(0, 0.5, 0.05, 2000, 400); },
  midnight() { [84, 88, 91, 96].forEach((n, i) => tone(N(n), i * 0.06, 0.35, "sine", 0.16)); tone(N(60), 0, 0.5, "sine", 0.18); },
  abyss()    { tone(N(40), 0, 1.2, "sine", 0.4, N(33)); noise(0, 1.1, 0.12, 600, 80); tone(N(79), 0.25, 0.6, "sine", 0.08); },
  hadal() {   // 1 in Attillion: deep boom, then a golden fanfare and shimmer
    tone(N(31), 0, 1.4, "sine", 0.6, N(26)); noise(0, 0.6, 0.25, 900, 60);
    [72, 76, 79, 84].forEach((n, i) => { tone(N(n), 0.18 + i * 0.11, 0.5, "triangle", 0.28); tone(N(n + 12), 0.18 + i * 0.11, 0.4, "sine", 0.08); });
    tone(N(84), 0.65, 1.1, "triangle", 0.3); tone(N(88), 0.65, 1.1, "sine", 0.14); tone(N(91), 0.65, 1.1, "sine", 0.12);
    for (let i = 0; i < 10; i++) tone(N(96 + (i % 5) * 2), 0.7 + i * 0.07, 0.25, "sine", 0.06);
  },
  win()  { [60, 64, 67, 72, 76].forEach((n, i) => tone(N(n), i * 0.1, 0.4, "triangle", 0.25)); tone(N(84), 0.5, 0.8, "sine", 0.15); },
  lose() { [67, 64, 60, 55].forEach((n, i) => tone(N(n), i * 0.14, 0.45, "triangle", 0.22)); },
  tie()  { tone(N(67), 0, 0.3, "triangle", 0.25); tone(N(67), 0.2, 0.4, "triangle", 0.25); }
};

window.KrillionSound = {
  play(name, gain) {
    if (vol <= 0 || !SOUNDS[name]) return;
    if (!ensure()) return;
    // a per-call gain stage lets opponent sounds play a little quieter
    out = ctx.createGain(); out.gain.value = gain == null ? 1 : gain; out.connect(master);
    try { SOUNDS[name](); } catch (e) {}
  },
  get volume() { return vol; },
  set volume(v) {
    vol = Math.max(0, Math.min(1, v));
    try { localStorage.setItem("krillion:volume", JSON.stringify(vol)); } catch (e) {}
    if (master) master.gain.value = vol * vol;
  }
};
})();
</script>
